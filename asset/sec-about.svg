<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110">
<defs>
<linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7353c"/><stop offset="1" stop-color="#8a1c22"/></linearGradient>
<linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="1190" y2="0"><stop offset="0" stop-color="#e0675c"/><stop offset=".5" stop-color="#5fb3b8"/><stop offset="1" stop-color="#5fb3b8" stop-opacity="0"/></linearGradient>
</defs>
<style>
.lt{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(-6px) scale(1.3)}100%{opacity:1;transform:none}}
.l{stroke-dasharray:900;stroke-dashoffset:900;animation:d 1.8s ease-out .6s forwards}@keyframes d{to{stroke-dashoffset:0}}
.s{opacity:0;animation:f 1s ease-out 1.4s forwards}@keyframes f{to{opacity:1}}
.dot{animation:bl 2.4s ease-in-out infinite}@keyframes bl{50%{opacity:.3}}
</style>
<rect x="30" y="22" width="340" height="80" rx="7" fill="url(#fr)" stroke="#4a0d10" stroke-width="2"/>
<rect x="40" y="32" width="320" height="62" rx="3" fill="#161616"/>
<path d="M44 40H356" stroke="#000" stroke-opacity=".55"/><path d="M44 46H356" stroke="#000" stroke-opacity=".55"/><path d="M44 52H356" stroke="#000" stroke-opacity=".55"/><path d="M44 58H356" stroke="#000" stroke-opacity=".55"/><path d="M44 64H356" stroke="#000" stroke-opacity=".55"/><path d="M44 70H356" stroke="#000" stroke-opacity=".55"/><path d="M44 76H356" stroke="#000" stroke-opacity=".55"/><path d="M44 82H356" stroke="#000" stroke-opacity=".55"/><path d="M44 88H356" stroke="#000" stroke-opacity=".55"/>
<rect x="156.0" y="8" width="88" height="22" rx="4" fill="#f3ead2" stroke="#4a0d10" stroke-width="1.5"/>
<text x="200.0" y="24" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" letter-spacing="5" fill="#b3262d">MENU</text>
<circle cx="142.0" cy="19" r="3" fill="#e0675c" class="dot"/><circle cx="258.0" cy="19" r="3" fill="#e0675c" class="dot" style="animation-delay:1.2s"/>
<g font-family="'Arial Black','Helvetica Neue',Impact,Arial,sans-serif" font-size="26" font-weight="900" fill="#f4f1ea"><text x="76.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.25s">T</text><text x="95.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.32s">H</text><text x="114.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.39s">E</text><text x="152.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.53s">G</text><text x="171.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.60s">R</text><text x="190.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.67s">I</text><text x="209.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.74s">L</text><text x="228.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.81s">L</text><text x="266.5" y="74" text-anchor="middle" class="lt" style="animation-delay:0.95s">C</text><text x="285.5" y="74" text-anchor="middle" class="lt" style="animation-delay:1.02s">O</text><text x="304.5" y="74" text-anchor="middle" class="lt" style="animation-delay:1.09s">O</text><text x="323.5" y="74" text-anchor="middle" class="lt" style="animation-delay:1.16s">K</text></g>
<text x="400" y="58" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#d98a82" class="s">your friendly neighbour from across the street</text>

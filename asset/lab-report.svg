name: Update check date

on:
  schedule:
    - cron: "7 * * * *"   # every hour; only saves when the day has changed
  workflow_dispatch:       # adds a "Run workflow" button for testing

permissions:
  contents: write          # allowed to update files in this repository only

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write today's date into the check
        run: |
          TODAY=$(TZ=Etc/GMT-3 date +'%b %-d')
          sed -i -E "s|(<text id=\"date\"[^>]*>)[^<]*(</text>)|\1${TODAY}\2|" asset/lab-report.svg

      - name: Save only if the date changed
        run: |
          if git diff --quiet; then
            echo "Date unchanged, nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update check date"
          git push
</svg>

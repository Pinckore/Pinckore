.u{stroke-dasharray:420;stroke-dashoffset:420;animation:d 1s ease-out .6s forwards}@keyframes d{to{stroke-dashoffset:0}}
.s{opacity:0;animation:f .8s ease-out 1s forwards}@keyframes f{to{opacity:1}}
.ln{stroke-dasharray:900;stroke-dashoffset:900;animation:d2 1.6s ease-out 1.1s forwards}@keyframes d2{to{stroke-dashoffset:0}}
</style>
